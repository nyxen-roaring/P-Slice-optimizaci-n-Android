on:
  workflow_call:
    inputs:
      name:
        required: false
        type: string
        default: Android
      os:
        required: false
        type: string
        default: ubuntu-latest
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string
      cachePath:
        required: true
        type: string
      cacheLibrariesPath:
        required: true
        type: string
      exportPath:
        required: false
        type: string
        default: android

env:
  HAXE_VERSION: 4.3.6
  PROJECT_NAME: PSliceEngine

jobs:
  build:
    name: Build Android
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Restore Libraries for compilation
        uses: actions/cache/restore@v4
        with:
          key: ${{ inputs.cacheLibrariesPath }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true
          path: |
            .haxelib/

      - name: Restore existing build cache for faster compilation
        id: load-cache
        uses: actions/cache/restore@v4
        with:
          # La key lleva el run_id: cada build guarda su propio cache
          # y restaura el más reciente con el prefijo (sin borrar nada a mano).
          key: ${{ inputs.cachePath }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cachePath }}-
          path: |
            export/release/android/haxe/
            export/release/android/obj/

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'project.xml') }}
          restore-keys: |
            gradle-${{ runner.os }}-
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Configure Android
        env:
          PLAYSTORE_FIREBASE: ${{ secrets.PLAYSTORE_FIREBASE }}
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
          printf '%s' "$PLAYSTORE_FIREBASE" > ./setup/google-services.json

          # Si el secret falta (p. ej. en un fork) o no es JSON válido, usa uno de relleno
          echo "Tamaño del secret: $(wc -c < ./setup/google-services.json) bytes"
          if ! python3 -c "
          import json
          d = json.load(open('./setup/google-services.json', encoding='utf-8-sig'))
          assert isinstance(d, dict) and d.get('client') and d.get('project_info')
          " 2>/dev/null; then
            echo "::warning::PLAYSTORE_FIREBASE vacío o inválido; usando google-services.json de relleno"
            cat > ./setup/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.mikolka9144.pslice" }
                },
                "api_key": [ { "current_key": "AIzaSyDummyKeyDummyKeyDummyKeyDummyKey0" } ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Compile
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Sign APK with the proper key
        env:
          OUT_DIR: ./export/release/android/bin/app/build/outputs/apk/release/
          SIGNING_KEY: ${{ secrets.MIKOLKA_PASSWORD }}
          SIGNING_ALIAS: pslice
          SIGNING_FILE: ${{ secrets.MIKOLKA_KEYSTORE }}
        run: |
          rm -f ./key.keystore
          printf '%s' "$SIGNING_FILE" | base64 -d > ./key.keystore

          mv '${{ env.OUT_DIR }}PSliceEngine-release.apk' '${{ env.OUT_DIR }}PSliceEngine-unsigned.apk'
          $ANDROID_HOME/build-tools/35.0.1/zipalign -P 16 -f 4 '${{ env.OUT_DIR }}PSliceEngine-unsigned.apk' '${{ env.OUT_DIR }}PSliceEngine-release.apk'

          $ANDROID_HOME/build-tools/35.0.1/apksigner sign --ks key.keystore --ks-key-alias $SIGNING_ALIAS --ks-pass "env:SIGNING_KEY" --key-pass "env:SIGNING_KEY" '${{ env.OUT_DIR }}PSliceEngine-release.apk'
          rm '${{ env.OUT_DIR }}PSliceEngine-unsigned.apk' ./key.keystore

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error
          compression-level: 0 # el APK ya está comprimido

      # Se ejecuta después de subir el APK para no retrasarlo
      - name: Upload debugging symbols (Android)
        continue-on-error: true
        run: sh ./setup/firebase_spell.sh

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          key: ${{ inputs.cachePath }}-${{ github.run_id }}
          path: |
            export/release/android/haxe/
            export/release/android/obj/
