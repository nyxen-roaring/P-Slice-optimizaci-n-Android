name: Build the game (Android)

on:
  push:
    branches: [master-dev]
  workflow_dispatch:

# Cancela builds viejos de la misma rama si llega un push nuevo
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildCache:
    name: Libraries cache
    permissions:
      contents: read
    uses: ./.github/workflows/dependencies.yml
    with:
      os: ubuntu-24.04 # antes macos-15 (más lento y más caro); el cache es cross-OS
      CACHE_NAME: P-Slice.1.0.mobile-cache
      setupScript: sh ./setup/mobile.sh

  BuildAndroid:
    name: Build Android
    needs: BuildCache
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      name: Android
      os: ubuntu-24.04
      exportPath: android
      # Una sola arquitectura = compila mucho menos. Ajusta si necesitas armv7.
      buildArgs: "android -arm64"
      cacheLibrariesPath: P-Slice.1.0.mobile-cache
      artifactName: P-Slice.1.0.android
      cachePath: P-Slice.1.0.build-android
      artifactPath: "export/release/android/bin/app/build/outputs/apk/release/*.apk"
