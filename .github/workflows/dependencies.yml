on:
  workflow_call:
    inputs:
      CACHE_NAME:
        required: true
        type: string
      os:
        required: true
        type: string
      setupScript:
        required: true
        type: string

env:
  HAXE_VERSION: 4.3.6

jobs:
  build:
    name: Libraries
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    steps:
      # Un solo paso de cache: restaura y, si hubo miss, guarda solo al terminar el job
      - name: Restore Libraries cache
        id: load-lib-cache
        uses: actions/cache@v4
        with:
          key: ${{ inputs.CACHE_NAME }}
          enableCrossOsArchive: true
          path: |
            .haxelib/

      - name: Checkout
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Haxe
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Setup haxelib
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        run: haxelib newrepo

      - name: Install Libraries
        if: steps.load-lib-cache.outputs.cache-hit != 'true'
        run: ${{ inputs.setupScript }}
